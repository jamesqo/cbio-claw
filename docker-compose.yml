services:
    hermes-cbio-gateway:
        image: ${HERMES_IMAGE}
        container_name: hermes-cbio-gateway
        restart: unless-stopped

        volumes:
            - ${HERMES_DATA}:/opt/data
            - /var/run/docker.sock:/var/run/docker.sock
            - ./docker/docker-entrypoint.sh:/docker-entrypoint.sh:ro
            - ${REPO_ROOT}:/Code
        entrypoint: ["/docker-entrypoint.sh"]
        command: gateway run
        ports:
            - "${HERMES_PORT}:8642"
        environment:
            - API_SERVER_HOST=0.0.0.0
            - API_SERVER_KEY=${API_SERVER_KEY}
            - HERMES_UID=${HERMES_UID}
            - HERMES_GID=${HERMES_GID}
        env_file:
            - ${HERMES_DATA}/.env

    hermes-cbio-dashboard:
        profiles:
            - dashboard
        image: ${HERMES_IMAGE}
        container_name: hermes-cbio-dashboard
        restart: unless-stopped
        volumes:
            - ${HERMES_DATA}:/opt/data
        command: dashboard --no-open --insecure --host 0.0.0.0 --port ${HERMES_DASHBOARD_PORT}
        ports:
            - "${HERMES_DASHBOARD_PORT}:${HERMES_DASHBOARD_PORT}"
        env_file:
            - ${HERMES_DATA}/.env

    hermes-cbio-cli:
        profiles:
            - cli
        image: ${HERMES_IMAGE}
        container_name: hermes-cbio-cli

        volumes:
            - ${HERMES_DATA}:/opt/data
            - ${REPO_ROOT}:/Code
        stdin_open: true
        tty: true
        command: chat
        env_file:
            - ${HERMES_DATA}/.env
